<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaon Bazaar | Fresh Village Products</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8f1;
      color: #26351f;
    }

    header {
      background: #2e7d32;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 25px;
    }

    header span {
      color: #dcedc8;
    }

    .cart {
      background: white;
      color: #2e7d32;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .hero {
      padding: 60px 7%;
      text-align: center;
      background: linear-gradient(135deg, #dcedc8, #fffde7);
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 12px;
      color: #1b5e20;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 550px;
      padding: 14px;
      border: 2px solid #81c784;
      border-radius: 30px;
      outline: none;
      font-size: 16px;
    }

    .section {
      padding: 35px 7%;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2e7d32;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .category {
      padding: 10px 18px;
      border: none;
      border-radius: 25px;
      background: #e8f5e9;
      color: #1b5e20;
      cursor: pointer;
      font-weight: bold;
    }

    .category:hover {
      background: #81c784;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 12px #00000015;
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-info {
      padding: 17px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #2e7d32;
      font-size: 19px;
      font-weight: bold;
      margin: 10px 0;
    }

    .buy-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #2e7d32;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .buy-btn:hover {
      background: #1b5e20;
    }

    .about {
      background: #e8f5e9;
      text-align: center;
      line-height: 1.7;
    }

    footer {
      background: #1b5e20;
      color: white;
      text-align: center;
      padding: 25px;
    }
